key: rust
name: Rust
description: Rust toolchain through rustup, with CARGO_HOME and RUSTUP_HOME under /opt.
match:
  files: [Cargo.toml, rust-toolchain.toml, rust-toolchain]
installer:
  mise:
    tool: rust
    version: latest
    bins: [cargo, rustc, rustup]
check:
  command: rustc --version && cargo --version
image:
  # rustup installs into the home directory unless both variables are set
  # when mise installs the tool.
  env:
    CARGO_HOME: /opt/cargo
    RUSTUP_HOME: /opt/rustup
  dirs:
    - path: /opt/cargo
      owner: user
    - path: /opt/rustup
      owner: user
  read_only: [/opt/rustup]
  read_write: [/opt/cargo]
  # cargo and rustc under CARGO_HOME are rustup proxies; the toolchain
  # binaries are the processes that open connections.
  runtime_globs: [/opt/rustup/toolchains/*/bin/*]
provides: [cargo, rustc, rustup, rustfmt, rustdoc]
# rustup and the toolchain installer crash under QEMU user emulation, for
# example when an arm64 host builds a linux/amd64 image (issue #9).
emulation_unsafe: true
profiles: [crates-io]
