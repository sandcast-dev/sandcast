# Example provider profile. OpenShell does not load it; import it explicitly:
#   openshell provider profile lint   -f providers/gitlab.yaml
#   openshell provider profile import -f providers/gitlab.yaml --global
#
# Copy and edit this file rather than importing it unchanged. `binaries` is the
# least-privilege control that decides which processes may reach the endpoints
# below, so it has to name the paths in *your* image.
#
# Client binaries:   glab, git (git's git-remote-https helper matches by ancestry).
# Reference layout:  glab and git on PATH at /usr/bin or /usr/local/bin
#                    (Debian/Ubuntu `apt install git glab`, Alpine `apk add git glab`).
# Credential scope:  GITLAB_TOKEN, sent as a bearer authorization header to the
#                    endpoints below and nowhere else.
# Endpoint access:   gitlab.com REST API (/api/v4) and GraphQL (/api/graphql)
#                    read-only; gitlab.com clone/fetch only. Push
#                    (git-receive-pack) and REST writes stay denied.
#                    Self-managed instances need their own copy with that host.
# Smoke test:        openshell sandbox create --provider <name> -- \
#                      git ls-remote https://gitlab.com/gitlab-org/gitlab-test.git HEAD

id: gitlab
display_name: GitLab
description: GitLab API and Git operations
category: source_control
credentials:
  - name: api_token
    description: GitLab token
    env_vars: [GITLAB_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  # gitlab.com serves the REST API and the git transport on the same host.
  # GET, HEAD and OPTIONS cover read-only REST calls and the ref
  # advertisement. Git smart HTTP also needs POST to */git-upload-pack for
  # clone/fetch, which the read-only preset blocks, so the rules are spelled
  # out. Push (git-receive-pack) and REST writes stay denied; enabling them
  # requires an explicit policy proposal.
  - host: gitlab.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "**" }
      - allow: { method: HEAD, path: "**" }
      - allow: { method: OPTIONS, path: "**" }
      - allow: { method: POST, path: "/**/git-upload-pack" }
  - host: gitlab.com
    port: 443
    path: /api/graphql
    protocol: graphql
    access: read-only
    enforcement: enforce
binaries: [/usr/bin/glab, /usr/local/bin/glab, /usr/bin/git, /usr/local/bin/git]
