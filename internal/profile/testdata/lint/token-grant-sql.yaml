id: example
display_name: Example
credentials:
  - name: api_key
    env_vars: [EXAMPLE_TOKEN]
    auth_style: bearer
    header_name: authorization
    token_grant:
      grant_type: client_credentials
      token_endpoint: https://auth.example.com/token
endpoints:
  - host: db.example.com
    port: 5432
    protocol: sql
    access: read-only
    enforcement: audit
