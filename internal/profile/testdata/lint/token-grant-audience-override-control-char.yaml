id: example
display_name: Example
credentials:
  - name: api_key
    env_vars: [EXAMPLE_TOKEN]
    auth_style: bearer
    header_name: authorization
    token_grant:
      grant_type: token_exchange
      token_endpoint: https://auth.example.com/token
      audience_overrides:
        - audience: https://api.example.com
          host: "api\u0001bad.example.com"
